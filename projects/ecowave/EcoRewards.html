<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Eco Rewards · EcoWave</title><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/lucide@latest"></script><script src="theme.js"></script></head><body><nav class="nav shell"><a class="brand" href="index.html">Eco<span>Wave</span></a><div class="navlinks"><a href="index.html">Home</a><a href="https://teachablemachine.withgoogle.com/models/yQuXQ2mVc/" target="_blank">Scanner</a><a href="marketPlace.html">Marketplace</a><a href="EcoRewards.html">Rewards</a><a href="Information.html">Learn</a></div><div class="xp-pill">⚡ <span class="nav-xp">0</span> XP</div><button class="theme-toggle" id="themeToggle" onclick="toggleEcoWaveTheme()" type="button" aria-label="Switch to dark mode" title="Dark mode">🌙</button></nav><main class="shell page"><section class="page-header"><div><span class="eyebrow"><i data-lucide="gift" width="15"></i> EcoPass</span><h1>Eco Rewards</h1><p>Turn your XP into useful rewards and keep building sustainable habits.</p></div></section><div class="big-xp"><div class="label">AVAILABLE XP</div><div class="value" id="xpValue">0</div></div><section><div class="section-head"><div><h2>Available rewards</h2><p>Redeem a reward when you have enough XP.</p></div></div><div id="rewardList" class="reward-grid"></div></section><div class="back"><a class="btn btn-secondary" href="index.html"><i data-lucide="arrow-left" width="17"></i> Back to EcoWave</a></div></main><footer class="footer">EcoWave · Live sustainably, earn rewards, save the planet.</footer><script>document.querySelectorAll('.nav-xp').forEach(e=>e.textContent=localStorage.getItem('userXP')||0);if(window.lucide)lucide.createIcons();</script><script>
let userXP=parseInt(localStorage.getItem('userXP'))||0;
let rewards=JSON.parse(localStorage.getItem('rewards'))||[
{name:'$100 Amazon Gift Card',cost:450,icon:'ticket'},
{name:'Nike Coupon',cost:100,icon:'shopping-bag'},
{name:'$10 Amazon Gift Card',cost:50,icon:'utensils'},
{name:'Environmental Donation',cost:250,icon:'heart-handshake'}];
const xp=document.getElementById('xpValue');
function renderRewards(){
 xp.textContent=userXP;document.querySelectorAll('.nav-xp').forEach(e=>e.textContent=userXP);
 const list=document.getElementById('rewardList');list.innerHTML='';
 rewards.forEach((r,i)=>{
  const card=document.createElement('div');card.className='card reward-card';
  const locked=userXP<r.cost;
  card.innerHTML='<div><div class="icon" style="margin-bottom:12px"><i data-lucide="'+(r.icon||'gift')+'"></i></div><h3>'+r.name+'</h3><p>'+r.cost+' XP required</p></div><button class="btn '+(locked?'btn-secondary':'btn-primary')+'" onclick="redeem('+i+')">'+(locked?'Locked':'Redeem')+'</button>';
  list.appendChild(card);
 });lucide.createIcons();
}
function redeem(i){const r=rewards[i];if(userXP<r.cost){alert('Not enough XP yet.');return;}userXP-=r.cost;localStorage.setItem('userXP',userXP);alert('Reward redeemed: '+r.name);renderRewards();}
renderRewards();
</script></body></html>
